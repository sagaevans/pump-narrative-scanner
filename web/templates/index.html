<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Narrative Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Pump Narrative Scanner</h1>
        <p class="subtitle">Solana Meme Token Research Dashboard</p>
    </header>

    <main>
        <p class="disclaimer">
            This tool is for research and screening only.
            It does not provide investment advice and does not execute trades.
        </p>

        <!-- Filters -->
        <section class="filters">
            <div class="filter-group">
                <label for="search-input">Search</label>
                <input type="text" id="search-input" placeholder="Name or symbol..." />
            </div>
            <div class="filter-group">
                <label for="min-score-input">Min Score</label>
                <input type="number" id="min-score-input" placeholder="0.0" min="0" max="1" step="0.05" />
            </div>
            <div class="filter-group">
                <label for="risk-select">Risk Level</label>
                <select id="risk-select">
                    <option value="">All</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="filter-group">
                <button id="apply-filters" class="btn btn-primary">Apply</button>
                <button id="clear-filters" class="btn btn-secondary">Clear</button>
            </div>
        </section>

        <!-- Results count -->
        <div class="results-info">
            <span id="results-count">Loading...</span>
            <div class="results-actions">
                <span id="data-source-badge" class="data-source-badge">...</span>
                <button id="refresh-btn" class="btn btn-refresh">Refresh Live Data</button>
            </div>
        </div>

        <!-- Refresh status message -->
        <div id="refresh-status" class="refresh-status" style="display: none;"></div>

        <!-- Token cards -->
        <section id="token-list"></section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
